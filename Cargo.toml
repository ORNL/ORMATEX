[package]
name = "ormatex"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ormatex"
crate-type = ["cdylib", "rlib"]
path = 'src/lib.rs'

[features]
plot = ["dep:plotlars", "dep:polars"]
python = ["dep:pyo3", "dep:numpy", "dep:ndarray", "dep:faer-ext"]

[dependencies]
thiserror = "1.0"
assert_approx_eq = "1.1.0"
num-traits = "0.2.18"
reborrow = "0.5.5"
rayon = "*"
libm = "0.2.8"
rand = "0.8.5"
rand_distr = "0.4.3"
statrs = "0.18.0"
csv = "1.4.0"

# faer lin alg
faer = {version = "0.23.2", features=["unstable",]}
faer-traits = "0.23.0"
faer_gmres = "0.4.1"

# optional deps
plotlars = {version="0.11.5", optional=true, features=["export-default"]}
polars = {version="0.52", optional=true}

# python binding deps
pyo3 = {version="=0.26", features = ["extension-module"], optional=true}
numpy = {version="0.26", optional=true}
ndarray = {version=">=0.16", features=["rayon"], optional=true}
faer-ext = {version=">=0.7.1", features=["ndarray", "numpy"], optional=true}

[tool.maturin]
module-name = "ormatex"
profile = "release"
editable-profile = "release"
features = ["python"]
