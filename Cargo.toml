[package]
name = "ormatex"
version = "0.0.1"
edition = "2024"
readme = "src/README.md"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "ormatex"
crate-type = ["cdylib", "rlib"]
path = 'src/lib.rs'

[features]
default = []
plot = ["dep:kuva"]
python = ["dep:pyo3", "dep:numpy", "dep:faer-ext"]

[dependencies]
assert_approx_eq = "1.1.0"
num-traits = "0.2.18"
num-complex = "0.4"
reborrow = "0.5.5"
rayon = "1.12.0"
libm = "0.2.8"
rand = "0.8.5"
rand_distr = "0.4.3"
statrs = "0.18.0"
csv = "1.4.0"
flexi_logger = "0.31"
log = "0.4"

# faer lin alg
faer = {version = "0.24.4", features=["unstable",]}
faer-traits = "0.24.0"
faer_gmres = "0.5"

# optional deps
kuva = {version="0.1", optional=true}

# python binding deps
pyo3 = {version="0.29", features = ["extension-module"], optional=true}
numpy = {version="0.29", optional=true}
# ndarray = {version="0.17", features=["rayon"], optional=true}
# faer-ext = {version="0.8.0", features=["ndarray", "numpy"], optional=true}
faer-ext = { git = "https://github.com/wgurecky/faer-ext", branch = "pyo3_0_29", features=["ndarray", "numpy"], optional=true}

[tool.maturin]
module-name = "ormatex"
profile = "release"
editable-profile = "release"
features = ["python"]

[package.metadata.docs.rs]
rustdoc-args = [ "--html-in-header", "katex.html" ]
